<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TA 장기상품 라인업 | MeAI 영업지원도구</title>
<style>
:root{
  --green:#0F5C46; --green-deep:#0A4534; --green-soft:#E4F0EB;
  --red:#990011;
  --ink:#1C2622; --sub:#5C6B64; --faint:#8A968F;
  --paper:#F3F6F4; --card:#FFFFFF; --line:#DFE8E3;
  --c-tong:#0F5C46; --c-dan:#1D5FA8; --c-pet:#C06A14; --c-jae:#7A6248; --c-sil:#6B3FA0;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55;
  padding-bottom:60px;
}
button{font-family:inherit; cursor:pointer; border:none; background:none}

/* ── 헤더 ── */
.hero{
  background:linear-gradient(150deg,var(--green-deep) 0%,var(--green) 62%,#177A5D 100%);
  color:#fff; padding:26px 18px 62px; position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; right:-70px; top:-70px; width:230px; height:230px;
  border-radius:50%; background:rgba(255,255,255,.06);
}
.hero::before{
  content:''; position:absolute; right:20px; bottom:-90px; width:170px; height:170px;
  border-radius:50%; background:rgba(255,255,255,.05);
}
.brandline{display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.14em; opacity:.92; font-weight:700}
.brandline .dot{width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 0 3px rgba(255,255,255,.18); flex:none}
.hero h1{font-size:26px; font-weight:800; letter-spacing:-.03em; margin-top:10px; position:relative; z-index:1}
.hero p{font-size:13px; opacity:.85; margin-top:6px; position:relative; z-index:1}
.hero .stat{margin-top:14px; display:inline-flex; align-items:baseline; gap:6px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.22); padding:5px 13px; border-radius:99px; font-size:12px; position:relative; z-index:1}
.hero .stat b{font-size:16px; font-weight:800}

/* ── 검색/필터 (스티키) ── */
.controls{
  position:sticky; top:0; z-index:30;
  background:var(--paper); padding:0 14px 10px;
  margin-top:-34px;
  box-shadow:0 6px 14px -12px rgba(20,50,40,.25);
}
.searchbox{
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1.5px solid var(--line); border-radius:var(--r);
  padding:12px 16px; box-shadow:0 8px 22px -14px rgba(15,92,70,.35);
}
.searchbox:focus-within{border-color:var(--green)}
.searchbox svg{flex:none}
.searchbox input{border:none; outline:none; font-size:15px; width:100%; font-family:inherit; background:transparent; color:var(--ink)}
.searchbox input::placeholder{color:var(--faint)}
.searchbox .clear{color:var(--faint); font-size:18px; line-height:1; padding:2px 4px; display:none}

.chips{display:flex; gap:7px; overflow-x:auto; padding:11px 2px 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; padding:8px 15px; border-radius:99px; font-size:13px; font-weight:700;
  background:var(--card); color:var(--sub); border:1.5px solid var(--line);
  transition:all .15s;
}
.chip small{font-weight:400; opacity:.75; margin-left:3px}
.chip.on{background:var(--green); color:#fff; border-color:var(--green)}
.chip.toggle.on{background:var(--red); border-color:var(--red)}

/* ── 본문 ── */
main{max-width:760px; margin:0 auto; padding:6px 14px 0}
.grouphead{
  display:flex; align-items:center; gap:9px; margin:24px 2px 10px;
}
.grouphead .bar{width:4px; height:17px; border-radius:2px; flex:none}
.grouphead h2{font-size:15px; font-weight:800; letter-spacing:-.02em}
.grouphead .cnt{font-size:12px; color:var(--faint); font-weight:700}

/* ── 카드 ── */
.card{
  background:var(--card); border:1.5px solid var(--line); border-radius:var(--r);
  margin-bottom:10px; overflow:hidden; position:relative;
  transition:box-shadow .18s, border-color .18s;
}
.card::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:var(--catcolor,var(--green));
}
.card.open{border-color:var(--catcolor,var(--green)); box-shadow:0 12px 28px -16px rgba(15,60,45,.35)}
.cardbtn{
  width:100%; text-align:left; padding:15px 15px 14px 19px;
  display:flex; align-items:center; gap:10px;
}
.cardbtn:active{background:#FAFCFB}
.cardmain{flex:1; min-width:0}
.pname{font-size:15.5px; font-weight:800; letter-spacing:-.02em; line-height:1.35; white-space:pre-line}
.badges{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.bdg{font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; background:#F0F4F2; color:var(--sub); white-space:nowrap}
.bdg.age{background:var(--green-soft); color:var(--green-deep)}
.bdg.term{background:#EEF3FB; color:#1D5FA8}
.bdg.exam{background:#FBF1EC; color:#A34A12}
.bdg.exam.std{background:#F1F1F6; color:#4E4E66}
.arrow{flex:none; width:26px; height:26px; border-radius:50%; background:#F0F4F2; display:flex; align-items:center; justify-content:center; transition:transform .22s, background .22s}
.card.open .arrow{transform:rotate(180deg); background:var(--green); }
.card.open .arrow svg path{stroke:#fff}

.detail{max-height:0; overflow:hidden; transition:max-height .32s ease}
.detail-in{padding:2px 16px 16px 19px; border-top:1px dashed var(--line)}
.drow{margin-top:13px}
.dlabel{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:800; color:var(--green-deep); letter-spacing:.04em;
  margin-bottom:5px;
}
.dlabel::before{content:''; width:6px; height:6px; border-radius:2px; background:var(--catcolor,var(--green))}
.dval{
  font-size:13.5px; white-space:pre-line; color:#33403A;
  background:#F8FAF9; border:1px solid #ECF1EE; border-radius:10px; padding:10px 13px;
  line-height:1.6;
}
.dval.none{color:var(--faint); background:transparent; border-style:dashed}
.dgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 10px}
@media (max-width:430px){.dgrid{grid-template-columns:1fr}}

/* ── 기타 ── */
.empty{text-align:center; color:var(--faint); padding:60px 0 30px; font-size:14px}
.empty b{display:block; font-size:16px; color:var(--sub); margin-bottom:6px}

.changes{
  max-width:760px; margin:34px auto 0; padding:0 14px;
}
.changes .box{
  background:#FFF9F0; border:1.5px solid #F2E3C8; border-radius:var(--r); padding:16px 18px;
}
.changes h3{font-size:13.5px; font-weight:800; color:#8A5A10; display:flex; align-items:center; gap:7px}
.changes ul{margin-top:9px; padding-left:2px; list-style:none}
.changes li{font-size:13px; color:#6E5A32; padding:3px 0 3px 16px; position:relative}
.changes li::before{content:''; position:absolute; left:2px; top:11px; width:5px; height:5px; border-radius:50%; background:#D9A93F}

footer{
  max-width:760px; margin:26px auto 0; padding:0 14px;
  font-size:11.5px; color:var(--faint); line-height:1.7; text-align:center;
}
.collapse-all{
  position:fixed; right:16px; bottom:18px; z-index:40;
  background:var(--ink); color:#fff; font-size:12.5px; font-weight:700;
  padding:10px 16px; border-radius:99px; box-shadow:0 10px 24px -8px rgba(0,0,0,.4);
  display:none; align-items:center; gap:6px;
}
.collapse-all.show{display:inline-flex}

mark{background:#FFE9A8; color:inherit; border-radius:3px; padding:0 1px}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
@media (min-width:760px){
  .hero{padding:38px 24px 74px; text-align:left}
  .hero h1{font-size:32px}
  .controls{padding-left:calc(50% - 366px); padding-right:calc(50% - 366px)}
}
</style>
</head>

let state = { cat:'전체', q:'', easyOnly:false };

const $list = document.getElementById('list');
const $chips = document.getElementById('chips');
const $q = document.getElementById('q');
const $qClear = document.getElementById('qClear');
const $collapseAll = document.getElementById('collapseAll');
document.getElementById('totalCnt').textContent = PRODUCTS.length;

function isEasy(p){ return /간편|325|355|3N5|31\b|유병자/.test(p.exam); }

function buildChips(){
  const counts = {'전체':PRODUCTS.length};
  CATS.forEach(c=>counts[c]=PRODUCTS.filter(p=>p.cat===c).length);
  let html = ['전체',...CATS].map(c=>
    `<button class="chip${state.cat===c?' on':''}" data-cat="${c}">${c}<small>${counts[c]}</small></button>`
  ).join('');
  html += `<button class="chip toggle${state.easyOnly?' on':''}" data-easy="1">간편심사만</button>`;
  $chips.innerHTML = html;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(s){
  const t = esc(s);
  if(!state.q) return t;
  const qe = state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return t.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>');
}

function filtered(){
  return PRODUCTS.filter(p=>{
    if(state.cat!=='전체' && p.cat!==state.cat) return false;
    if(state.easyOnly && !isEasy(p)) return false;
    if(state.q && !p.name.replace(/\n/g,' ').toLowerCase().includes(state.q.toLowerCase())) return false;
    return true;
  });
}

function detailRow(label, val, half){
  if(!val) val='';
  const none = !val || val==='없음';
  return `<div class="drow${half?' half':''}"><div class="dlabel">${label}</div><div class="dval${none?' none':''}">${none?(val||'—'):esc(val)}</div></div>`;
}

function render(){
  const items = filtered();
  buildChips();
  if(!items.length){
    $list.innerHTML = `<div class="empty"><b>검색 결과가 없습니다</b>다른 검색어나 카테고리를 선택해 보세요</div>`;
    updateCollapseBtn();
    return;
  }
  // 카테고리 > 소분류 순서 유지 그룹핑
  const groups = [];
  items.forEach(p=>{
    const key = p.cat+'|'+p.sub;
    let g = groups.find(x=>x.key===key);
    if(!g){ g={key, cat:p.cat, sub:p.sub, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  $list.innerHTML = groups.map(g=>{
    const color = CATCOLOR[g.cat];
    const head = `<div class="grouphead"><span class="bar" style="background:${color}"></span><h2>${g.cat} · ${g.sub}</h2><span class="cnt">${g.items.length}</span></div>`;
    const cards = g.items.map(p=>{
      const examStd = /표준|일반/.test(p.exam) && !/간편/.test(p.exam);
      return `
      <div class="card" data-id="${p.id}" style="--catcolor:${color}">
        <button class="cardbtn" aria-expanded="false">
          <div class="cardmain">
            <div class="pname">${hl(p.name)}</div>
            <div class="badges">
              ${p.age?`<span class="bdg age">${esc(p.age.split('\n')[0])}</span>`:''}
              ${p.term?`<span class="bdg term">${esc(p.term.split('\n')[0])}</span>`:''}
              <span class="bdg exam${examStd?' std':''}">${esc(p.exam)}</span>
            </div>
          </div>
          <span class="arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 9l7 7 7-7" stroke="#5C6B64" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <div class="detail"><div class="detail-in">
          <div class="dgrid">
            ${detailRow('가입연령', p.age)}
            ${detailRow('갱신 / 만기', p.term)}
          </div>
          ${detailRow('종구분 (선택유형)', p.types)}
          ${detailRow('납입면제 사유', p.waiver)}
          ${detailRow('인수플랜', p.plan)}
          ${detailRow('피보험자 알릴의무', p.notice)}
        </div></div>
      </div>`;
    }).join('');
    return head + cards;
  }).join('');
  updateCollapseBtn();
}

function updateCollapseBtn(){
  const anyOpen = document.querySelector('.card.open');
  $collapseAll.classList.toggle('show', !!anyOpen);
}

$list.addEventListener('click', e=>{
  const btn = e.target.closest('.cardbtn');
  if(!btn) return;
  const card = btn.parentElement;
  const detail = card.querySelector('.detail');
  const open = card.classList.toggle('open');
  btn.setAttribute('aria-expanded', open);
  detail.style.maxHeight = open ? detail.scrollHeight+'px' : '0';
  updateCollapseBtn();
});

$collapseAll.addEventListener('click', ()=>{
  document.querySelectorAll('.card.open').forEach(c=>{
    c.classList.remove('open');
    c.querySelector('.detail').style.maxHeight='0';
    c.querySelector('.cardbtn').setAttribute('aria-expanded','false');
  });
  updateCollapseBtn();
});

$chips.addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  if(chip.dataset.easy){ state.easyOnly = !state.easyOnly; }
  else { state.cat = chip.dataset.cat; }
  render();
});

$q.addEventListener('input', ()=>{
  state.q = $q.value.trim();
  $qClear.style.display = state.q ? 'block' : 'none';
  render();
});
$qClear.addEventListener('click', ()=>{
  $q.value=''; state.q=''; $qClear.style.display='none'; render(); $q.focus();
});

render();
</script>
</body>
</html>
